<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#1c1c24" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5effc4" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sbGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Bridge Connecting Arches (Academia -> Industry) -->
  <path d="M 12 44 Q 32 20 52 44" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 12 44 Q 32 28 52 44" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Node (Academia Pillar) -->
  <circle cx="16" cy="42" r="3.5" fill="#f4f4f5" />
  <!-- Right Node (Industry Gear) -->
  <circle cx="48" cy="42" r="3.5" fill="#f4f4f5" />

  <!-- Central Kinetic Lightning Spark (Skill & Innovation) -->
  <polygon points="34,14 24,31 32,31 29,48 42,28 34,28" fill="url(#sparkGrad)" filter="url(#glow)" stroke="#09090b" stroke-width="1.2" />
</svg>
